name: Emulator acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: python3 -m unittest discover -s tools -p test_fixture_fetch.py
      - run: python3 tools/build_media.py --check
      - run: python3 tools/prepare_dma_fixture.py
      - run: python3 tools/prepare_gdtr_fixture.py
      - run: python3 tools/prepare_idtr_fixture.py
      - run: python3 tools/prepare_smsw_fixture.py
      - run: python3 tools/prepare_fpu_init_fixture.py
      - run: python3 tools/prepare_pic_fixture.py
      - run: python3 tools/prepare_pic_smm_fixture.py
      - run: python3 tools/prepare_pic_poll_fixture.py
      - run: python3 tools/prepare_pic_single_fixture.py
      - run: python3 tools/prepare_fdc_pio_fixture.py
      - run: python3 tools/prepare_fdc_write_fixture.py
      - run: python3 tools/prepare_fdc_write_multi_fixture.py
      - run: python3 tools/prepare_fdc_bios_fixture.py
      - run: python3 tools/prepare_pit_mode2_fixture.py
      - run: python3 tools/prepare_pit_mode3_fixture.py
      - run: python3 tools/prepare_pit_mode0_fixture.py
      - run: python3 tools/prepare_pit_mode4_fixture.py
      - run: python3 tools/prepare_pit_mode0_rewrite_fixture.py
      - run: python3 tools/prepare_pit_mode3_rewrite_fixture.py
      - run: python3 tools/prepare_pit_counter_latch_fixture.py
      - run: python3 tools/prepare_v30_bound_fixture.py
      - run: python3 tools/prepare_v30_repc_fixture.py
      - run: python3 tools/prepare_v30_nibble_mem_fixture.py
      - run: python3 tools/prepare_v30_add4s_fixture.py
      - run: python3 tools/prepare_v30_segment_irq_fixture.py
      - run: python3 tools/prepare_ide_verify_fixture.py
      - run: python3 tools/prepare_rtc_fixture.py
      - run: python3 tools/prepare_rtc_set_fixture.py
      - run: python3 tools/prepare_opn_ch3_fixture.py
      - run: python3 tools/prepare_opna_irq_fixture.py
      - run: python3 tools/prepare_freedos.py
      - run: python3 tools/prepare_font_fixture.py
      - run: python3 tools/prepare_dos_apps.py
      - run: python3 tools/prepare_cpu_fixture.py
      - run: python3 tools/prepare_hdd_fixture.py
      - run: python3 tools/prepare_music_fixture.py
      - run: python3 tools/prepare_device_fixture.py
      - run: python3 tools/build_font.py --check
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
