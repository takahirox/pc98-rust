name: Emulator acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: python3 tools/build_media.py --check
      - run: python3 tools/prepare_freedos.py
      - run: python3 tools/prepare_dos_apps.py
      - run: python3 tools/prepare_cpu_fixture.py
      - run: python3 tools/build_font.py --check
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
